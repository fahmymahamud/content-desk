<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Content Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap">
<style>
/* Layout: phone-first studio. Ideas -> Approved (picture storyboard + edit prompt) -> Made (video, caption, post). One light look by choice. */
:root{
  --paper:#f4f7f5; --card:#ffffff; --ink:#151c2b; --muted:#5b6474; --line:#dde3dc;
  --green:#12824a; --green-soft:#e3f3ea; --amber:#9a5b00; --amber-soft:#fbf0dc; --grey-soft:#eef0f3; --blue:#1f5fbf; --blue-soft:#e6eefb; --red:#b3261e; --red-soft:#fbeaea;
  --display:'Montserrat','Arial Black',sans-serif; --body:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-block:18px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:900 14px var(--display);flex:none}
h1{font:900 23px/1.1 var(--display);margin:0;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;margin:14px 0 14px;padding:8px 0;background:var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 6px;font:800 14px var(--body);cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab span{font-variant-numeric:tabular-nums;opacity:.7;font-weight:600}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.panel{display:grid;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.find h2{font:900 16px var(--display);margin:0 0 6px}
textarea,input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:500 14px/1.4 var(--body);color:var(--ink);background:var(--card);resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:800 14px var(--body);cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pill{border-radius:999px;padding:2px 9px;font:700 11px var(--body)}
.pillar{background:var(--amber-soft);color:var(--amber)}
h3{font:900 18px/1.2 var(--display);margin:8px 0 6px;text-wrap:balance}
.hook{background:var(--green-soft);border-left:4px solid var(--green);border-radius:8px;padding:8px 12px;font:800 15px/1.3 var(--body);margin:8px 0}
.why{font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
summary{cursor:pointer;font:700 13px var(--body)}
.src{margin:6px 0 0;padding-left:18px;font-size:13px}.src a{color:var(--blue)}
.cap{white-space:pre-wrap;background:var(--grey-soft);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.job{display:flex;gap:8px;align-items:center;border-radius:10px;padding:8px 11px;font-size:13px;margin-top:10px}
.job.queued,.job.working{background:var(--blue-soft);color:var(--blue)} .job.done{background:var(--green-soft);color:var(--green)} .job.failed{background:var(--red-soft);color:var(--red)} .job.scheduled{background:var(--amber-soft);color:var(--amber)} .job.cancelled{background:var(--grey-soft);color:var(--muted)}
input[type=datetime-local]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 14px var(--body);color:var(--ink);background:var(--card);max-width:100%}
.sched{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.spin{width:14px;height:14px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 10px;scroll-snap-type:x mandatory}
.fr{flex:none;width:150px;scroll-snap-align:start}
.fw{position:relative;width:150px;height:267px;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:#f1f6f3}
.fw .cs-st{transform:scale(.5556)}
.strip.tight .fr,.strip.tight .fw{width:116px}
.strip.tight .fw{height:206px}
.strip.tight .fw .cs-st{transform:scale(.4296)}
.strip.tight .fv{font-size:11px}
.strip.tight .fn{font-size:10px}
.fn{font:800 11px var(--body);color:var(--muted);margin-top:5px;display:flex;justify-content:space-between}
.fv{font-size:12.5px;line-height:1.35;margin-top:2px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.made-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media (max-width:560px){.made-grid{grid-template-columns:1fr}}
video{display:block;width:100%;max-width:240px;max-height:430px;margin:0 auto;border-radius:12px;background:#000;aspect-ratio:9/16}
.thumb{width:90px;border-radius:8px;border:1px solid var(--line)}
.plat{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.plat label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer;background:var(--card)}
.posted a{color:var(--blue);font-weight:700}
.err{color:var(--red);font-size:13px}
.mstrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mi{position:relative;width:96px;border:1px solid var(--line);border-radius:12px;background:var(--grey-soft);overflow:hidden;font-size:11.5px}
.mi img,.mi video{display:block;width:96px;height:96px;object-fit:cover;background:#151c2b;border-radius:0;max-width:none;max-height:none;aspect-ratio:auto;margin:0}
.mi .aud{width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:30px;background:var(--blue-soft);border:0;cursor:pointer;color:var(--blue)}
.mi .aud small{font:700 11px var(--body)}
.mi .cap{padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.mi .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(21,28,43,.75);color:#fff;font:800 13px/24px var(--body);cursor:pointer;padding:0}
.mi .vo{display:flex;gap:4px;align-items:center;padding:3px 6px 5px;font:700 11px var(--body);color:var(--ink);cursor:pointer}
.mi.up{display:flex;align-items:center;justify-content:center;height:120px;color:var(--blue)}
.mi .note{padding:0 6px 5px;color:var(--muted);font-size:11px;line-height:1.25;max-height:42px;overflow:hidden}
.addm{border-style:dashed}
.proj{border:2px solid var(--ink)}
.proj>h2{font:900 18px/1.2 var(--display);margin:6px 0}
.pill.inp{background:var(--ink);color:#fff}
.pill.angle{background:var(--blue-soft);color:var(--blue)}
.inq{margin:6px 0 0;padding:8px 12px;border-left:4px solid var(--line);background:var(--grey-soft);border-radius:8px;white-space:pre-wrap;font-size:14px}
.opts{display:grid;gap:10px;margin-top:12px}
.opts .box{background:var(--paper)}
.opts-h{font:800 13px var(--body);margin:14px 0 0;color:var(--muted)}
select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:700 14px var(--body);background:var(--card);color:var(--ink)}
.sec{font:900 16px var(--display);margin:6px 0 0}
.palive{margin-top:12px;padding:12px 14px;border:1px dashed var(--green);border-radius:12px;background:var(--green-soft)}
</style>
<div class="wrap">
  <div class="top"><div class="logo">CD</div><div><h1>Content Desk</h1><p class="sub">One input, several ideas. Approve the best, check the storyboard, make the video, post.</p></div></div>
  <div class="tabs" role="group" aria-label="Sections">
    <button class="tab" data-t="ideas" aria-pressed="true">Ideas <span id="n-ideas">0</span></button>
    <button class="tab" data-t="approved" aria-pressed="false">Approved <span id="n-approved">0</span></button>
    <button class="tab" data-t="made" aria-pressed="false">Made <span id="n-made">0</span></button>
  </div>
  <div id="view" class="panel"><div class="empty"><b>Loading your desk…</b>Your ideas, storyboards and videos appear here.</div></div>
</div>
<script src="scenes.js"></script>
<script>
/* ===== YOUR SETTINGS (edit these 6 lines) ===== */
const CONFIG={
  brand:'My Channel',          // your channel or brand name
  handle:'@mychannel',         // your social handle, shown on every reel
  avatar:false,                // true only if you added your own pose images in av/ (see README)
  avatarDesc:'',               // e.g. 'a cartoon avatar in a hoodie' (used when avatar is true)
  audience:'',                 // e.g. 'busy small business owners in Malaysia' (optional)
  trigger:'PASTE_YOUR_DESK_AGENT_TRIGGER_ID'  // id of your "Desk Agent" scheduled task (trig_...)
};
const TRIGGER=CONFIG.trigger, SERVER='Claude Code Remote';
let tab='ideas', ideas=[], projects=[], jobs={}, db=null, mcp=null, sample=null, assets=null, dls=null, canWrite=true, busy={}, pending=[], upBusy={}, mErr={}, drawQ=[], drawing=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
DESK.css();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
const st=i=>i.status||'new';
const IN={ideas:['new'],approved:['approved','made'],made:['ready','posted']};
const inTab=i=>IN[tab].includes(st(i));
const NARRATORS=[[16,'Michael — warm male'],[17,'Onyx — deep male'],[18,'Puck — bright male'],[15,'Liam — younger male'],[26,'George — British male'],[3,'Heart — female'],[9,'Sarah — female']];
function lastJob(ideaId,type){return Object.values(jobs).filter(j=>j.ideaId===ideaId&&(!type||[].concat(type).includes(j.type))).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]}
const whenTxt=iso=>{try{return new Date(iso).toLocaleString('en-SG',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}catch(_){return iso}};
const PLAT={instagram:'Instagram',facebook:'Facebook',youtube:'YouTube Shorts',tiktok:'TikTok'};
function jobHtml(j){if(!j)return'';const lab={queued:'Starting the agent…',working:j.message||'Working…',done:j.message||'Done',failed:j.message||'Something went wrong',scheduled:'📅 Scheduled for '+whenTxt(j.postAt)+' → '+(j.platforms||[]).map(p=>PLAT[p]||p).join(', '),cancelled:'Schedule cancelled'}[j.state]||j.state;
  return `<div class="job ${esc(j.state)}" role="status">${['queued','working'].includes(j.state)?'<span class="spin"></span>':''}<span>${esc(lab)}</span></div>`}
function counts(){const shown=i=>{const p=pOf(i);return !(p&&p.status==='closed')};const n=k=>ideas.filter(i=>IN[k].includes(st(i))&&(k!=='ideas'||shown(i))).length;$('#n-ideas').textContent=n('ideas');$('#n-approved').textContent=n('approved');$('#n-made').textContent=n('made')}
// ---------- media ----------
const KIND_ICON={image:'🖼️',video:'🎬',audio:'🎙️'};
function mediaItem(m,o){o=o||{};const url='/_blob/'+m.id;let body;
  if(m.kind==='image')body=`<img src="${esc(url)}" alt="${esc(m.name||'photo')}" loading="lazy">`;
  else if(m.kind==='video')body=`<video data-k="mi-${esc(m.id)}" src="${esc(url)}#t=0.5" controls playsinline preload="metadata"></video>`;
  else body=`<button class="aud" data-play="${esc(m.id)}" aria-label="Play voice note">▶<small>${m.seconds?Math.round(m.seconds)+' s':'Voice'}</small></button>`;
  return `<div class="mi" title="${esc(m.name||'')}">${body}${o.remove!=null?`<button class="x" data-rmmedia="${esc(o.remove)}" aria-label="Remove">✕</button>`:''}
   <div class="cap">${KIND_ICON[m.kind]||''} ${esc(m.name||m.kind)}</div>
   ${m.kind!=='image'&&o.voice!=null?`<label class="vo"><input type="checkbox" data-voice="${esc(o.voice)}" ${o.voOn?'checked':''}> My voiceover</label>`:''}
   ${m.note?`<div class="note">${esc(m.note)}</div>`:''}</div>`}
function cardMedia(i){const ms=mediaOf(i),p=pOf(i);if(!ms.length&&!p)return'';
  return `${p?`<p class="hint" style="margin:6px 0 0">From input: <b>${esc(pTitle(p))}</b></p>`:''}${ms.length?`<div class="mstrip">${ms.map((m,k)=>mediaItem(m,{})).join('')}</div>${voiceOf(i)!=null?'<p class="hint">Narrated with your own voice.</p>':''}`:''}`}
const MAXB=20*1024*1024;
function kindOf(f){const t=f.type||'',n=(f.name||'').toLowerCase();if(t.startsWith('image/')||/\.(heic|heif)$/.test(n))return'image';if(t.startsWith('video/')||/\.(mp4|mov|webm|m4v)$/.test(n))return'video';if(t.startsWith('audio/')||/\.(m4a|mp3|wav|ogg|opus|aac|amr|flac)$/.test(n))return'audio';return null}
async function shrinkImage(f){if(/gif|svg/.test(f.type)&&f.size<MAXB)return{blob:f,type:f.type};
  try{const bm=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));if(b)return{blob:b,type:'image/jpeg'}}catch(e){}
  if(['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)&&f.size<MAXB)return{blob:f,type:f.type};
  throw new Error('This photo type cannot be read here. Send it as JPG or PNG.')}
function wavBytes(buf){const ch=buf.getChannelData(0),n=ch.length,sr=buf.sampleRate,ab=new ArrayBuffer(44+n*2),v=new DataView(ab);const w=(o,t)=>{for(let k=0;k<t.length;k++)v.setUint8(o+k,t.charCodeAt(k))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let k=0;k<n;k++){const x=Math.max(-1,Math.min(1,ch[k]));v.setInt16(44+k*2,x<0?x*32768:x*32767,true)}return new Uint8Array(ab)}
function b64(u8){let s='';for(let k=0;k<u8.length;k+=32768)s+=String.fromCharCode.apply(null,u8.subarray(k,k+32768));return btoa(s)}
async function voiceBlob(f){let dec;
  try{const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();dec=await ac.decodeAudioData(await f.arrayBuffer());ac.close&&ac.close()}catch(e){dec=null}
  if(!dec)throw new Error('This voice file cannot be read here. Try .m4a or .mp3.');
  if(dec.duration>300)throw new Error('Voice note is over 5 minutes. Send a shorter one.');
  const sr=24000,off=new OfflineAudioContext(1,Math.ceil(dec.duration*sr),sr);const src=off.createBufferSource();src.buffer=dec;src.connect(off.destination);src.start();const out=await off.startRendering();
  return{blob:new Blob(['data:audio/wav;base64,'+b64(wavBytes(out))],{type:'text/plain'}),type:'text/plain',seconds:Math.round(dec.duration*10)/10}}
async function uploadOne(f){const kind=kindOf(f);if(!kind)throw new Error(`${f.name}: only photos, videos and voice notes.`);let r;
  if(kind==='image')r=await shrinkImage(f);
  else if(kind==='audio')r=await voiceBlob(f);
  else{if(f.size>MAXB)throw new Error(`${f.name} is over 20 MB. Trim it or export a smaller copy.`);r={blob:f,type:/webm/.test(f.type)||/\.webm$/i.test(f.name)?'video/webm':'video/mp4'}}
  let up;try{up=await assets.upload(r.blob,{type:r.type})}catch(e){throw new Error(e&&e.code==='too_large'?`${f.name} is over 20 MB.`:e&&e.code==='quota_or_state'?'The desk storage is full. Remove old media first.':`Could not upload ${f.name}. Try again.`)}
  const m={id:up.id,kind,name:(f.name||kind).slice(0,60),type:r.type,addedAt:new Date().toISOString()};if(r.seconds)m.seconds=r.seconds;return m}
function pickFiles(){return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='image/*,video/*,audio/*,.m4a,.mp3,.wav,.ogg,.opus,.aac,.heic,.mov';inp.onchange=()=>res([...inp.files]);inp.click()})}
async function addMedia(target){const files=await pickFiles();if(!files.length)return;upBusy[target]=true;delete mErr[target];render();const got=[],errs=[];
  for(const f of files){try{got.push(await uploadOne(f))}catch(e){errs.push(e.message)}}
  try{if(target==='find')pending=pending.concat(got);
    else if(got.length&&target.startsWith('P|')){const pid=target.slice(2),pr=projects.find(x=>x.id===pid);await db.doc('projects/'+pid).update({media:(pr&&pr.media||[]).concat(got)});await fire({type:'media',projectId:pid})}}
  catch(e){errs.push('Could not save the media to this input.')}
  delete upBusy[target];if(errs.length)mErr[target]=errs.join(' ');render()}
const voiceUrls={};let voiceNow=null;
async function playVoice(btn,id){const lab=t=>{btn.innerHTML=t};
  try{if(voiceNow&&voiceNow.id===id&&!voiceNow.a.paused){voiceNow.a.pause();lab('▶<small>Paused</small>');return}
   if(voiceNow&&voiceNow.id!==id)voiceNow.a.pause();
   if(!voiceUrls[id]){lab('…<small>Loading</small>');const t=await (await fetch('/_blob/'+id)).text();const bin=atob(t.split(',').pop().trim());const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);voiceUrls[id]=URL.createObjectURL(new Blob([u],{type:'audio/wav'}))}
   const a=voiceNow&&voiceNow.id===id?voiceNow.a:new Audio(voiceUrls[id]);voiceNow={id,a};a.onended=()=>lab('▶<small>Play again</small>');await a.play();lab('⏸<small>Playing</small>')}
  catch(e){lab('⚠<small>Could not play</small>')}}
const pOf=i=>i&&i.projectId?projects.find(p=>p.id===i.projectId)||null:null;
const mediaOf=i=>{const p=pOf(i);return p?(p.media||[]):(i.media||[])};
const voiceOf=i=>{const p=pOf(i);const v=p?p.voiceover:i.voiceover;return typeof v==='number'?v:null};
const pTitle=p=>p.title||(p.query?(p.query.length>60?p.query.slice(0,57)+'…':p.query):(p.media||[]).length?'Your media':"Today's news");
function lastPJob(pid){return Object.values(jobs).filter(j=>j.projectId===pid).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]}
function mediaOpts(i){return mediaOf(i).map(m=>({kind:m.kind,url:'/_blob/'+m.id}))}
// ---------- render ----------
function render(){counts();const v=$('#view');const keep=document.activeElement&&document.activeElement.id;const vals={};document.querySelectorAll('textarea,input[type=text],input[type=datetime-local]').forEach(e=>vals[e.id]=e.value);
  const list=ideas.filter(inTab).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(a.rank||9)-(b.rank||9));
  let h='';
  if(tab==='ideas'){
    h+=`<section class="box find"><h2>New input</h2><p class="hint" style="margin:0 0 8px">One input = one project. Give an idea, a topic, a link, text, photos, clips or a voice note, and the agent develops 3 different reel ideas from it and draws every scene so you can watch them. Leave everything empty for today's news.</p>
    <textarea id="q" rows="3" placeholder="Your idea, topic, link or text"></textarea>

function pickFlow(i,want){if(want&&FLOWS[want])return want;const prev=i.storyboard&&i.storyboard.flow;const isAd=/promo|promot|offer|sale|discount|book|price|client|shop|service|app\b|product/i.test([(pOf(i)||{}).query,i.angle,i.title,i.note].join(' '));
  let keys=Object.keys(FLOWS).filter(k=>k!==prev&&(k!=='ad'||isAd));const a=String(i.angle||'').toLowerCase();
  const fit={'step':'countdown','myth':'myth','before':'beforeafter','pov':'pov','story':'coldopen','mistake':'countdown','hot take':'twist','tip':'montage','proof':'beforeafter','result':'beforeafter','scam':'twist','news':'loop','ad':'ad','promo':'ad'};
  const hit=Object.entries(fit).find(([w])=>a.includes(w));if(hit&&hit[1]!==prev&&Math.random()<.5&&keys.includes(hit[1]))return hit[1];
  return keys[Math.floor(Math.random()*keys.length)]||'twist'}
function SPEC(i,flowKey){const ms=mediaOf(i).filter(m=>m.kind!=='audio'),F=FLOWS[flowKey],hasM=ms.length>0;
  const cta=CTAS.sort(()=>Math.random()-.5).slice(0,3).map(c=>'"'+c+'"').join(', ');
  return `You design storyboards for short vertical reels (Instagram/TikTok/Facebook) made by the creator who owns this desk. Their own channel is ${CONFIG.handle} (${CONFIG.brand}${CONFIG.avatar&&CONFIG.avatarDesc?', presented by '+CONFIG.avatarDesc:''}${CONFIG.audience?'; audience: '+CONFIG.audience:''}). They ALSO make reels for other brands and businesses (clients, their own apps or products).
Reply with ONLY JSON: {"flow":"${flowKey}","brand":{...},"scenes":[...],"thumbnail":{...}}.

STEP 1 - WHOSE REEL IS THIS? Read the INPUT and IDEA below.
- If it promotes or is about a specific business, shop, service, product or app (e.g. a cleaning company promo, their own app), the reel belongs to THAT brand: "brand":{"name":"the brand name","handle":"their @handle if given, else the brand name, or \\"\\" if none","avatar":false}. Do not mention ${CONFIG.brand}, do not use avatar poses (pose null everywhere), and the CTA fits that business.
- Otherwise it is a ${CONFIG.brand} reel: "brand":{"name":"${CONFIG.brand}","handle":"${CONFIG.handle}","avatar":${CONFIG.avatar}}.
- Optional in brand: "accent":"#hex" (the colour of highlighted words; pick from the brand's look if a photo shows it) and "bg":"a CSS colour or gradient" for graphic scenes. Leave them out for ${CONFIG.brand}.

STEP 2 - FLOW for this storyboard: ${F.name}. ${F.how}
Follow this structure; it must not look like a generic explainer. ${F.n[0]} to ${F.n[1]} scenes, 15-40 seconds total.

Each scene: {"headline":"2-5 words, wrap ONE key word in *stars* to highlight it","narration":"what the narrator says, max 12 words, simple spoken English","kind":KIND,"data":{...},"pose":POSE or null,"posePos":"left"|"right","chip":"optional tiny label like a date or time, or omit"}.
KIND and its data:
- "media": {"media":index from MEDIA,"fit":"full"|"cover"|"contain","label":"optional 2-4 words","start":seconds into the clip (clips only),"sound":"narration"|"original","seconds":1-12 (only with sound original)}. "full" = the shot fills the whole screen (best for clips and real photos). "contain" for screenshots, posters or text-heavy images so nothing is cut. "original" plays the clip's own sound: then narration is "" unless a short line over it helps.
- "icon": {"emoji":"one emoji","label":"optional 2-4 words","motion":"drop"|"pop"|"spin"}
- "phone": {"lines":["up to 3 short screen lines"],"bubble":"optional short speech bubble"}
- "search": {"text":"what is typed","fix":"optional corrected text"}
- "chat": {"text":"a message, max 15 words"}
- "counter": {"value":number,"prefix":"optional e.g. RM or S$","suffix":"optional","label":"2-5 words"}
- "checklist": {"items":["2-5 short items"]}
- "cards": {"items":["3-5 one-word labels"],"highlight":index or omit}
- "stamp": {"emoji":"one emoji","text":"ONE WORD like BLOCKED, FAKE, FREE, AFTER"}
- "quote": {"text":"a real quote from the facts only","by":"who"}
- "versus": {"left":{"emoji":"","text":"2-3 words"},"right":{"emoji":"","text":"2-3 words"}}
- "bigtext": {"text":"a short number or word, max 8 characters"}
- "table": {"cols":["","A","B"],"rows":[["label","x","y"]]} (max 4 rows)
- "steps": {"items":[{"emoji":"","text":"max 6 words"}]} (2-4 items)
POSE is one of: ${DESK.POSES.join(', ')}.
${hasM?`MEDIA FIRST: The creator gave their own photos/clips (listed under MEDIA). They are the main material of this reel.
- At least 70% of the scenes are "media" scenes, and EVERY listed photo and clip is used at least once.
- Prefer "fit":"full". Cut long clips into several shots with different "start" values (stay inside the clip length) instead of switching to graphics.
- Use graphic kinds only to add a fact the shots cannot show (a price, a number, a step list), and never two graphic scenes in a row.
- The scene 1 hook is a media scene with his strongest shot.
- ${'Avatar'}: at most 2 scenes (none if brand avatar is false).`:`No photos or clips were given: build the reel from graphic kinds. Vary the kinds; do not use the same kind twice in a row. Avatar (only if brand avatar is true): 2 to 5 scenes, each a different fitting pose, alternating left/right; other scenes pose null.`}
Use ONLY facts given below (prices, dates, names exactly as given); say "allegedly" for charges; no made-up numbers, quotes or offers.
Ending: pick a CTA that fits this flow and brand, e.g. ${cta} or the business's own action. Do not always end with "Follow for more."
thumbnail: {"headline":"4-7 words, *one* highlighted word, curiosity","emoji":"one emoji","pose":POSE or "none" (must be "none" if brand avatar is false),"sticker":"2-4 words with one *highlighted* word","media":index of their best photo/clip (use it whenever MEDIA exists),"full":true to fill the thumbnail with that shot,"start":seconds for a clip}`}
function mediaRules(i){const ms=mediaOf(i);if(!ms.length)return'';
  const list=ms.map((m,k)=>`[${k}] ${m.kind==='audio'?'voice note (not a picture, cannot be a media scene)':m.kind==='video'?'video clip':'photo'}${m.seconds?' '+m.seconds+'s':''} "${m.name||''}"${m.note?' - '+m.note:''}${m.transcript?' | says: '+m.transcript:''}`).join('\n');
  const vi=voiceOf(i),vo=vi!=null&&ms[vi]?ms[vi]:null;
  return `\n\nMEDIA THE CREATOR ADDED:\n${list}`+
   (vo?`\n\nVOICEOVER: The creator narrates this reel themselves with [${vi}]. ${vo.transcript?`Their recording says: "${vo.transcript}"\nThe narration of all scenes, read in order, must be exactly their words split across the scenes (same words, same order, nothing added or dropped; 3-12 words per scene). Ignore the scene count, length and CTA rules; their words decide the length. Every scene needs narration. Do not use sound "original".`:'The transcript is not ready yet: write narration as usual; the words will be replaced by his recording.'}`:'')}
function ideaFacts(i){return `${brandInfo(i)}\nIDEA\nTitle: ${i.title}\nHook: ${i.hook}${i.angle?'\nAngle: '+i.angle:''}\nFacts: ${i.story}\n${i.note?'Creator note: '+i.note:''}${mediaRules(i)}`}
function clean(sb,flowKey){if(!sb||!Array.isArray(sb.scenes)||!sb.scenes.length)throw new Error('no scenes');
  const b=sb.brand&&typeof sb.brand==='object'?sb.brand:{};const brand={name:String(b.name||CONFIG.brand).slice(0,60),handle:b.handle==null?CONFIG.handle:String(b.handle).slice(0,40),avatar:CONFIG.avatar&&b.avatar!==false};
  if(/^#[0-9a-f]{3,8}$/i.test(b.accent||''))brand.accent=b.accent;if(b.bg&&/^[#a-z0-9(),.%\s-]+$/i.test(b.bg)&&String(b.bg).length<160)brand.bg=String(b.bg);
  sb.scenes=sb.scenes.slice(0,20).map(s=>({headline:String(s.headline||''),narration:String(s.narration||''),kind:DESK.KINDS.includes(s.kind)?s.kind:'icon',data:s.data&&typeof s.data==='object'?s.data:{emoji:'✨'},pose:brand.avatar&&DESK.POSES.includes(s.pose)?s.pose:null,posePos:s.posePos==='right'?'right':'left',...(s.chip?{chip:String(s.chip).slice(0,24)}:{})}));
  sb.thumbnail=sb.thumbnail&&typeof sb.thumbnail==='object'?sb.thumbnail:{headline:sb.scenes[0].headline,emoji:'🤯',pose:brand.avatar?'jaw-dropped':'none'};
  if(!brand.avatar)sb.thumbnail.pose='none';
  return {flow:FLOWS[sb.flow]?sb.flow:flowKey,brand,scenes:sb.scenes,thumbnail:sb.thumbnail}}
async function makeBoard(i,instruction,want){if(!sample){alert0(i.id,'This page cannot ask Claude here. Open it in claude.ai while signed in.');return}
  const flowKey=instruction&&i.storyboard&&FLOWS[i.storyboard.flow]?i.storyboard.flow:instruction?(want||'twist'):pickFlow(i,want);
  busy[i.id]=instruction?'Updating the storyboard…':'Drawing a '+FLOWS[flowKey].name.toLowerCase()+' storyboard…';render();
  try{const prompt=instruction?`${SPEC(i,flowKey)}\n\n${ideaFacts(i)}\n\nCURRENT STORYBOARD JSON:\n${JSON.stringify(i.storyboard)}\n\nThe creator wants exactly these changes: ${instruction}\nDo only what they asked, in the way they described it. Do not add extra scenes, ideas, angles or wording they did not ask for, and do not reinterpret or expand his request. Leave every other scene exactly as it is (same text, kind, data and pose), and keep the current flow and brand unless they asked to change them. Reply with the full updated JSON.`:`${SPEC(i,flowKey)}\n\n${ideaFacts(i)}`;
    const sb=clean(await sample.json(prompt,{modelTier:'default'}),flowKey);
    sb.voice=(pOf(i)||{}).narrator||16;
    await db.doc('ideas/'+i.id).update({storyboard:sb,sbError:''});return true}
  catch(e){await db.doc('ideas/'+i.id).update({sbError:e&&e.code==='not_granted'?'You turned off "Ask Claude" for this page. Turn it on in the page permissions to draw storyboards.':e&&e.code==='rate_limited'?'Claude is busy right now. Try again in a minute.':'The storyboard could not be drawn. Press Update storyboard to try again.'}).catch(()=>{});return false}
  finally{delete busy[i.id];render()}}
function queueBoards(){if(!sample||!canWrite)return;
  ideas.filter(i=>st(i)==='new'&&!i.storyboard&&!i.sbError&&!busy[i.id]).forEach(i=>{if(!drawQ.includes(i.id))drawQ.push(i.id)});
  pumpQ()}
async function pumpQ(){if(drawing||!drawQ.length)return;drawing=true;
  const id=drawQ[0];const i=ideas.find(x=>x.id===id);
  try{if(i&&!i.storyboard&&st(i)==='new')await makeBoard(i)}catch(_){}
  drawQ=drawQ.filter(x=>x!==id);drawing=false;render();pumpQ()}

  db.collection('jobs').orderBy('at','desc').limit(60).onSnapshot(s=>{jobs={};s.docs.forEach(d=>jobs[d.id]={id:d.id,...d.data()});soon()},()=>{});
})();
</script>
